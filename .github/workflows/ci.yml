name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            src-tauri

      # rust/ and src-tauri/ are separate cargo workspace roots, so each is tested from its own directory.
      - name: Run Rust tests (rust workspace)
        run: cargo test --workspace
        working-directory: rust

      - name: Run Rust tests (Tauri app)
        run: cargo test
        working-directory: src-tauri

      - name: Run tests
        run: npm test
