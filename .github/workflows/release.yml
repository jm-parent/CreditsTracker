name: Release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --ignore-scripts

      # electron-winstaller (used by @electron-forge/maker-squirrel to build
      # the Windows Setup.exe auto-updater installer) ships its 7z.exe/7z.dll
      # binaries as arch-specific variants and normally copies the right one
      # into vendor/ via its own "install" npm script. That script is
      # skipped by --ignore-scripts above (needed to avoid the better-sqlite3
      # node-gyp/Visual Studio detection failure), so it must be run
      # explicitly here or squirrel packaging fails with "file not found".
      - name: Prepare electron-winstaller 7-Zip binaries
        run: node script/select-7z-arch.js
        working-directory: node_modules/electron-winstaller

      - name: Run tests
        run: npm test

      # semantic-release analyzes commit messages since the last release tag
      # (Conventional Commits: fix: -> patch, feat: -> minor, "BREAKING
      # CHANGE"/"!" -> major). If nothing warrants a release, it exits
      # without creating one. On release it bumps package.json, updates
      # CHANGELOG.md, builds the Windows Setup.exe installer bundle
      # (electron-forge make), tags the commit, pushes it back to master,
      # and publishes a GitHub Release with the Squirrel artifacts attached.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit it creates, so HEAD carries a
      # tag only when a release was published. The Tauri steps below are gated
      # on this output so unreleased pushes do not produce an installer.
      - name: Check whether a release was published
        id: release_check
        shell: bash
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # Tauri Windows bundle (NSIS installer), built alongside the Squirrel
      # build above until cutover. It runs after semantic-release so that
      # tauri.conf.json (version read from package.json) sees the bumped version.
      # Updater signing: the private key is read only from the CI secret
      # TAURI_SIGNING_PRIVATE_KEY (plus TAURI_SIGNING_PRIVATE_KEY_PASSWORD). It
      # is never written to a file. Updater artifacts are enabled in tauri.conf.json.
      - name: Setup Rust
        if: steps.release_check.outputs.released == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.release_check.outputs.released == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: Install Tauri CLI
        if: steps.release_check.outputs.released == 'true'
        run: cargo install tauri-cli --version "^2.12" --locked

      - name: Build Tauri Windows bundle
        if: steps.release_check.outputs.released == 'true'
        run: cargo tauri build
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Publishes the signed installer, its signature and latest.json to the release
      # semantic-release just created. The asset is renamed to a name without spaces so
      # the URL in latest.json matches what GitHub stores. The endpoint in
      # tauri.conf.json reads latest.json from releases/latest.
      - name: Publish Tauri updater artifacts
        if: steps.release_check.outputs.released == 'true'
        shell: bash
        working-directory: src-tauri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(git describe --exact-match --tags HEAD)
          VERSION=$(node -p "require('../package.json').version")
          BUNDLE=target/release/bundle/nsis
          SRC=$(ls "$BUNDLE"/*-setup.exe)
          ASSET="CreditsTracker-Rust-${VERSION}-x64-setup.exe"
          cp "$SRC" "$BUNDLE/$ASSET"
          cp "$SRC.sig" "$BUNDLE/$ASSET.sig"
          NOTES=$(gh release view "$TAG" --json body --jq .body)
          node -e '
            const fs = require("fs");
            const [version, notes, sig, url] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: sig, url } },
            }, null, 2));
          ' "$VERSION" "$NOTES" "$(cat "$BUNDLE/$ASSET.sig")" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          gh release upload "$TAG" "$BUNDLE/$ASSET" "$BUNDLE/$ASSET.sig" latest.json --clobber
