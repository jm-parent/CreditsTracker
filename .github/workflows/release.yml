name: Release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --ignore-scripts

      # electron-winstaller (used by @electron-forge/maker-squirrel to build
      # the Windows Setup.exe auto-updater installer) ships its 7z.exe/7z.dll
      # binaries as arch-specific variants and normally copies the right one
      # into vendor/ via its own "install" npm script. That script is
      # skipped by --ignore-scripts above (needed to avoid the better-sqlite3
      # node-gyp/Visual Studio detection failure), so it must be run
      # explicitly here or squirrel packaging fails with "file not found".
      - name: Prepare electron-winstaller 7-Zip binaries
        run: node script/select-7z-arch.js
        working-directory: node_modules/electron-winstaller

      - name: Run tests
        run: npm test

      # semantic-release analyzes commit messages since the last release tag
      # (Conventional Commits: fix: -> patch, feat: -> minor, "BREAKING
      # CHANGE"/"!" -> major). If nothing warrants a release, it exits
      # without creating one. On release it bumps package.json, updates
      # CHANGELOG.md, builds the Windows zip (electron-forge make), tags the
      # commit, pushes it back to master, and publishes a GitHub Release
      # with the zip attached.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
