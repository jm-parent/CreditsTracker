[package]
name = "agent_trace_store"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `reference/src/agent-trace-store.ts`: the SQLite store for local agent traces"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
shared = { path = "../shared" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
